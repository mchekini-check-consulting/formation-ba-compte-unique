# Base locale pour ./mvnw spring-boot:run (mêmes valeurs que application.yaml) :
#   docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: compte_unique
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
  # CU-382 (TECH-14) : Kafka local (un seul nœud, création automatique des topics), adresse localhost:9092.
  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "9092:9092"
