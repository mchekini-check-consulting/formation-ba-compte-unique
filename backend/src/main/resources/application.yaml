spring:
  application:
    name: compte-unique
  # Base PostgreSQL. Valeurs locales (compose.yaml) ; sur le cluster, remplacées par
  # SPRING_DATASOURCE_URL, _USERNAME, _PASSWORD (helm.yaml : database).
  datasource:
    url: jdbc:postgresql://localhost:5432/compte_unique
    username: app
    password: app
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # le schéma vient uniquement des migrations Flyway

app:
  liens:
    # Adresse de base des liens envoyés par e-mail ; par environnement dans helm.yaml.
    adresse-base: ${LIENS_ADRESSE_BASE:http://localhost:4200}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
