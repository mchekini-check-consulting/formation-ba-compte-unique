spring:
  application:
    name: compte-unique
  # Base PostgreSQL. Valeurs locales (compose.yaml) ; sur le cluster, remplacées par
  # SPRING_DATASOURCE_URL, _USERNAME, _PASSWORD (helm.yaml : database).
  datasource:
    url: jdbc:postgresql://localhost:5432/compte_unique
    username: app
    password: app
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # le schéma vient uniquement des migrations Flyway

server:
  # CU-48 : derrière le gateway, l'adresse IP de la cliente est lue dans X-Forwarded-For
  # (seuls les relais du réseau interne sont crus).
  forward-headers-strategy: native

app:
  conseiller:
    # CU-9 critère 8 : coordonnées affichées quand une ouverture en ligne est annulée par contrôle.
    # Valeur fictive du prototype, à remplacer par les vraies coordonnées.
    coordonnees: ${CONSEILLER_COORDONNEES:Service client Hi-Tech Bank — 01 23 45 67 89, du lundi au vendredi de 9 h à 18 h}
  liens:
    # Adresse de base des liens envoyés par e-mail ou SMS ; par environnement dans helm.yaml
    # (CU-87 : toujours celle de l'environnement, jamais celle de la production en test).
    adresse-base: ${LIENS_ADRESSE_BASE:http://localhost:4200}
  messages:
    # CU-87 : en test (local, dev, qualif), e-mails et SMS capturés et affichés sur
    # /test/emails et /test/sms au lieu d'être envoyés ; false en preprod et prod (helm.yaml).
    capture: ${MESSAGES_CAPTURE:true}
  connexion:
    # CU-48 : blocage d'une adresse IP après 20 échecs en 15 minutes. Désactivé en dev et qualif
    # (helm.yaml) : les postes de recette partagent la même adresse. Toujours actif en preprod et prod.
    limite-adresse-ip: ${CONNEXION_LIMITE_ADRESSE_IP:true}
  test:
    # CU-167 : journal de sécurité consultable sur /test/journal-securite en test (local, dev,
    # qualif) ; false en preprod et prod (helm.yaml).
    journal-consultable: ${JOURNAL_CONSULTABLE:true}
    # CU-143 : bouchon « Simuler un virement entrant » (/test/virements-entrants) en test (local, dev,
    # qualif) ; false en preprod et prod (helm.yaml) : le point d'accès n'existe alors pas.
    virements-simules: ${VIREMENTS_SIMULES:true}

logging:
  level:
    root: ${LOG_LEVEL:INFO}

# Swagger : description des API (/v3/api-docs) et page pour les essayer (/swagger-ui.html).
# Actif en local, dev et qualif ; SWAGGER_ACTIF=false en preprod et prod (helm.yaml) : les
# adresses de Swagger n'existent alors pas.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ACTIF:true}
  swagger-ui:
    enabled: ${SWAGGER_ACTIF:true}
