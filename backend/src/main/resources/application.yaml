spring:
  application:
    name: compte-unique
  # Base PostgreSQL. Valeurs locales (compose.yaml) ; sur le cluster, remplacées par
  # SPRING_DATASOURCE_URL, _USERNAME, _PASSWORD (helm.yaml : database).
  datasource:
    url: jdbc:postgresql://localhost:5432/compte_unique
    username: app
    password: app
  # CU-296 : certificat de clôture du Livret A, 2 Mo maximum (contrôlé par le service avec un message clair) ;
  # marge ici pour que la cliente reçoive ce message plutôt qu'une erreur technique.
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 3MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # le schéma vient uniquement des migrations Flyway
  # CU-382 (TECH-14) : Kafka (ADR-001, section 3 bis). Adresse et topics déclarés dans helm.yaml (envList) ;
  # l'application refuse de démarrer si une variable KAFKA_* manque (ConfigurationKafka).
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
    producer:
      # message « envoyé » seulement quand Kafka l'a enregistré, sans doublon en cas de nouvel essai
      acks: all
      properties:
        enable.idempotence: true
        # Kafka indisponible : le relais abandonne vite et réessaie au passage suivant (rien n'est perdu)
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      auto-offset-reset: earliest
      # message marqué « lu » seulement après la fin du traitement en base
      enable-auto-commit: false
    listener:
      ack-mode: record

server:
  # CU-48 : derrière le gateway, l'adresse IP de la cliente est lue dans X-Forwarded-For
  # (seuls les relais du réseau interne sont crus).
  forward-headers-strategy: native

app:
  conseiller:
    # CU-9 critère 8 : coordonnées affichées quand une ouverture en ligne est annulée par contrôle.
    # Valeur fictive du prototype, à remplacer par les vraies coordonnées.
    coordonnees: ${CONSEILLER_COORDONNEES:Service client Hi-Tech Bank — 01 23 45 67 89, du lundi au vendredi de 9 h à 18 h}
  liens:
    # Adresse de base des liens envoyés par e-mail ou SMS ; par environnement dans helm.yaml
    # (CU-87 : toujours celle de l'environnement, jamais celle de la production en test).
    adresse-base: ${LIENS_ADRESSE_BASE:http://localhost:4200}
  messages:
    # CU-87 : en test (local, dev, qualif), e-mails et SMS capturés et affichés sur
    # /test/emails et /test/sms au lieu d'être envoyés ; false en preprod et prod (helm.yaml).
    capture: ${MESSAGES_CAPTURE:true}
  connexion:
    # CU-48 : blocage d'une adresse IP après 20 échecs en 15 minutes. Désactivé en dev et qualif
    # (helm.yaml) : les postes de recette partagent la même adresse. Toujours actif en preprod et prod.
    limite-adresse-ip: ${CONNEXION_LIMITE_ADRESSE_IP:true}
  test:
    # CU-167 : journal de sécurité consultable sur /test/journal-securite en test (local, dev,
    # qualif) ; false en preprod et prod (helm.yaml).
    journal-consultable: ${JOURNAL_CONSULTABLE:true}
    # CU-143 : bouchon « Simuler un virement entrant » (/test/virements-entrants) en test (local, dev,
    # qualif) ; false en preprod et prod (helm.yaml) : le point d'accès n'existe alors pas.
    # Même interrupteur pour CU-145 (bouchon de vérification du nom du bénéficiaire, /test/verification-beneficiaire ;
    # IBAN de test acceptés) et CU-147 (/test/virements/{id}/refus). Le bouchon de virement sortant de CU-144 a été
    # retiré : un virement sortant ne part que vers un bénéficiaire (CU-147).
    virements-simules: ${VIREMENTS_SIMULES:true}
    # CU-295 critère 5 : « Simuler l'expiration du délai » de l'administration fiscale
    # (/test/livret-a/...) en test (local, dev, qualif) ; false en preprod et prod (helm.yaml).
    livret-a-simule: ${LIVRET_A_SIMULE:true}
    # CU-380 (TECH-12) : date métier modifiable sur /test/date-metier en test (local, dev, qualif) ;
    # false en preprod et prod (helm.yaml) : heure réelle de Paris, tout changement refusé (403).
    date-metier-modifiable: ${DATE_METIER_MODIFIABLE:true}
    # CU-381 (TECH-13) : page /test/catalogue (déposer le fichier du jour, lancer le batch, lire le journal) en test
    # (local, dev, qualif) ; false en preprod et prod (helm.yaml) : les routes n'existent alors pas.
    catalogue-simule: ${CATALOGUE_SIMULE:true}
    # CU-382 (TECH-14) : page /test/evenements (boîte d'envoi, événements reçus, messages en erreur, envoi d'un
    # message invalide) en test (local, dev, qualif) ; false en preprod et prod (helm.yaml).
    evenements-simules: ${EVENEMENTS_SIMULES:true}
    # CU-376 (TECH-08) : page /test/ordres (passer des ordres sur des contrats de test) et positions de test, en test
    # (local, dev, qualif) ; false en preprod et prod (helm.yaml) : routes absentes, positions de test jamais lues.
    ordres-simules: ${ORDRES_SIMULES:true}
  ordres:
    # CU-376 : heure limite de prise en compte des ordres, selon la date métier (« 12 h, à confirmer », ADR-001 §7).
    heure-limite: ${ORDRES_HEURE_LIMITE:12:00}
  catalogue:
    # CU-381 : heure du batch nocturne, selon la date métier (TECH-12), du lundi au vendredi. « 2 h, à confirmer ».
    heure: ${CATALOGUE_HEURE:2}
    # CU-412 : niveau de risque maximum par profil investisseur (décision PO du 23/11/2026, à confirmer par la
    # conformité), commun au PER et à l'assurance vie. Le niveau 7 n'est jamais proposé en ligne.
    risque-max:
      prudent: ${CATALOGUE_RISQUE_MAX_PRUDENT:3}
      equilibre: ${CATALOGUE_RISQUE_MAX_EQUILIBRE:4}
      dynamique: ${CATALOGUE_RISQUE_MAX_DYNAMIQUE:6}
    # CU-412 : frais de gestion annuels du contrat sur les unités de compte, en %.
    frais-contrat:
      per: ${CATALOGUE_FRAIS_CONTRAT_PER:0.50}
      av: ${CATALOGUE_FRAIS_CONTRAT_AV:0.65}
  virements:
    # CU-147 critère 5 : plafond d'un virement en centimes, à valider avec la conformité. 0 = pas de plafond.
    plafond-centimes: ${VIREMENTS_PLAFOND_CENTIMES:0}

logging:
  level:
    root: ${LOG_LEVEL:INFO}

# Swagger : description des API (/v3/api-docs) et page pour les essayer (/swagger-ui.html).
# Actif en local, dev et qualif ; SWAGGER_ACTIF=false en preprod et prod (helm.yaml) : les
# adresses de Swagger n'existent alors pas.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ACTIF:true}
  swagger-ui:
    enabled: ${SWAGGER_ACTIF:true}
