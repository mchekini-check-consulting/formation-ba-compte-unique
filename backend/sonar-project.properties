# Analyse SonarQube du composant (projet <dépôt>-<composant>), lancée par la CI
# après make test-unit (formation-ba-gitops/ci-template/sonarqube).
sonar.sources=compte-unique/src/main
sonar.tests=compte-unique/src/test
sonar.java.binaries=compte-unique/target/classes
sonar.java.test.binaries=compte-unique/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=compte-unique/target/site/jacoco/jacoco.xml
# Démarrage / câblage, sans logique à tester : hors calcul de couverture
sonar.coverage.exclusions=**/*Application.java
