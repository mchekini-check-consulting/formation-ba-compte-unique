# Microservices de ce dépôt, déployés par formation-ba-gitops sur chaque environnement.
# Valeurs littérales uniquement. replicas, tag et envList[].value acceptent
# une valeur unique ou une map par environnement : { dev: ..., qualif: ..., preprod: ..., prod: ... }
# URL : frontend/gateway https://<application>.formation-ba-compte-unique.<env>.check-consulting.net
#       backend : jamais d'URL directe (Service ClusterIP seulement), exposé par
#       le pod "gateway" ci-dessous (type: gateway) : .../gateway/<backend>/...
applications:
  - name: backend
    type: backend
    image: 205493924920.dkr.ecr.eu-west-3.amazonaws.com/formation-ba-compte-unique/backend
    # Écrit par Kargo (dev automatique ; qualif/preprod/prod : promotion par clic).
    # Garder une valeur par ligne, sans commentaire en fin de ligne : Kargo
    # remplace tout jusqu'à la fin de la ligne.
    tag:
      dev: d364ed3
      qualif: a93c30e
      preprod: ""
      prod: ""
    containerPort: 8080
    replicas: {dev: 1, qualif: 1, preprod: 2, prod: 2}
    service:
      port: 80
    # Pas d'Ingress direct : Service ClusterIP seulement. Exposé par le pod
    # "gateway" ci-dessous :
    #   https://gateway.formation-ba-compte-unique.<env>.check-consulting.net/backend/...  (préfixe retiré)
    # Appelable depuis le navigateur uniquement par les frontends de l'environnement (CORS).
    # Base PostgreSQL compte_unique : créée et sauvegardée automatiquement.
    # Consigne : dans backend/src/main/resources/application.yaml, déclarer
    #   spring.datasource.url, spring.datasource.username, spring.datasource.password
    # (valeurs locales) ; sur le cluster, Spring Boot les remplace par les variables
    # injectées SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD.
    database:
      name: compte_unique
    envList:
      - key: LOG_LEVEL
        value: {dev: debug, qualif: info, preprod: info, prod: warn}
      # Adresse de base des liens envoyés par e-mail (activation, réinitialisation).
      - key: LIENS_ADRESSE_BASE
        value:
          dev: "https://frontend.formation-ba-compte-unique.dev.check-consulting.net"
          qualif: "https://frontend.formation-ba-compte-unique.qualif.check-consulting.net"
          preprod: "https://frontend.formation-ba-compte-unique.preprod.check-consulting.net"
          prod: "https://frontend.formation-ba-compte-unique.prod.check-consulting.net"
      # CU-87 : e-mails et SMS capturés (pages /test/emails et /test/sms) en dev et qualif.
      - key: MESSAGES_CAPTURE
        value: {dev: "true", qualif: "true", preprod: "false", prod: "false"}
      # Comptes de test (db/demo) en dev et qualif, jamais en preprod ni en prod.
      - key: SPRING_FLYWAY_LOCATIONS
        value:
          dev: "classpath:db/migration,classpath:db/demo"
          qualif: "classpath:db/migration,classpath:db/demo"
          preprod: "classpath:db/migration"
          prod: "classpath:db/migration"
  - name: gateway
    type: gateway
    # Pas d'image/tag : fourni par la plateforme (petit Traefik autonome),
    # rien à construire ni à promouvoir. Expose les backends ci-dessus
    # (type: backend) sous https://gateway.formation-ba-compte-unique.<env>.check-consulting.net/<backend>/...
    # (préfixe retiré) ; CORS limité aux frontends de l'environnement.
    # Configuration personnalisée (routage, rate limiting, authentification
    # centralisée...) : voir gateway.yaml à la racine du dépôt. Si ce fichier
    # est absent, le routage vers les backends ci-dessus est généré
    # automatiquement (comportement par défaut).
    replicas: {dev: 1, qualif: 1, preprod: 2, prod: 2}
    ingress:
      enabled: true
  - name: frontend
    type: frontend
    image: 205493924920.dkr.ecr.eu-west-3.amazonaws.com/formation-ba-compte-unique/frontend
    # Écrit par Kargo (dev automatique ; qualif/preprod/prod : promotion par clic).
    # Garder une valeur par ligne, sans commentaire en fin de ligne : Kargo
    # remplace tout jusqu'à la fin de la ligne.
    tag:
      dev: d364ed3
      qualif: a93c30e
      preprod: ""
      prod: ""
    containerPort: 8080
    replicas: {dev: 1, qualif: 1, preprod: 2, prod: 2}
    service:
      port: 80
    ingress:
      enabled: true
      path: /
      stripPrefix: false
  - name: bouchons-identite
    type: backend
    image: 205493924920.dkr.ecr.eu-west-3.amazonaws.com/formation-ba-compte-unique/bouchons-identite
    # Écrit par Kargo (dev automatique ; qualif/preprod/prod : promotion par clic).
    # Garder une valeur par ligne, sans commentaire en fin de ligne : Kargo
    # remplace tout jusqu'à la fin de la ligne.
    tag:
      dev: "2540490"
      qualif: "2540490"
      preprod: ""
      prod: ""
    containerPort: 8080
    replicas: {dev: 1, qualif: 1, preprod: 2, prod: 2}
    service:
      port: 80
    # Bouchons des partenaires d'identification (Stripe Identity, sanctions/PEP).
    # Pas d'Ingress direct : exposé par le pod "gateway" :
    #   https://gateway.formation-ba-compte-unique.<env>.check-consulting.net/bouchons-identite/...  (préfixe retiré)
    # Base PostgreSQL bouchons_identite : créée et sauvegardée automatiquement.
    database:
      name: bouchons_identite
    envList:
      - key: LOG_LEVEL
        value: {dev: debug, qualif: info, preprod: info, prod: warn}
