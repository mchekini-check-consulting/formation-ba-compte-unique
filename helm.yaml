# Microservices de ce dépôt, déployés par formation-ba-gitops sur chaque environnement.
# Valeurs littérales uniquement. replicas, tag et envList[].value acceptent
# une valeur unique ou une map par environnement : { dev: ..., qualif: ..., preprod: ..., prod: ... }
# URL : frontend/gateway https://<application>.formation-ba-compte-unique.<env>.check-consulting.net
#       backend : jamais d'URL directe (Service ClusterIP seulement), exposé par
#       le pod "gateway" ci-dessous (type: gateway) : .../gateway/<backend>/...
applications:
  - name: backend
    type: backend
    image: 205493924920.dkr.ecr.eu-west-3.amazonaws.com/formation-ba-compte-unique/backend
    # Écrit par Kargo (dev automatique ; qualif/preprod/prod : promotion par clic).
    # Garder une valeur par ligne, sans commentaire en fin de ligne : Kargo
    # remplace tout jusqu'à la fin de la ligne.
    tag:
      dev: b9fe936
      qualif: c8d0f73
      preprod: ""
      prod: ""
    containerPort: 8080
    replicas: {dev: 1, qualif: 1, preprod: 2, prod: 2}
    service:
      port: 80
    # Pas d'Ingress direct : Service ClusterIP seulement. Exposé par le pod
    # "gateway" ci-dessous :
    #   https://gateway.formation-ba-compte-unique.<env>.check-consulting.net/backend/...  (préfixe retiré)
    # Appelable depuis le navigateur uniquement par les frontends de l'environnement (CORS).
    # Base PostgreSQL compte_unique : créée et sauvegardée automatiquement.
    # Consigne : dans backend/src/main/resources/application.yaml, déclarer
    #   spring.datasource.url, spring.datasource.username, spring.datasource.password
    # (valeurs locales) ; sur le cluster, Spring Boot les remplace par les variables
    # injectées SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD.
    database:
      name: compte_unique
    envList:
      - key: LOG_LEVEL
        value: {dev: debug, qualif: info, preprod: info, prod: warn}
      # Adresse de base des liens envoyés par e-mail (activation, réinitialisation).
      - key: LIENS_ADRESSE_BASE
        value:
          dev: "https://frontend.formation-ba-compte-unique.dev.check-consulting.net"
          qualif: "https://frontend.formation-ba-compte-unique.qualif.check-consulting.net"
          preprod: "https://frontend.formation-ba-compte-unique.preprod.check-consulting.net"
          prod: "https://frontend.formation-ba-compte-unique.prod.check-consulting.net"
      # CU-87 : e-mails et SMS capturés (pages /test/emails et /test/sms) en dev et qualif.
      - key: MESSAGES_CAPTURE
        value: {dev: "true", qualif: "true", preprod: "false", prod: "false"}
      # CU-48 : limite des échecs de connexion par adresse IP, désactivée en dev et qualif.
      - key: CONNEXION_LIMITE_ADRESSE_IP
        value: {dev: "false", qualif: "false", preprod: "true", prod: "true"}
      # CU-167 : journal de sécurité consultable (page /test/journal-securite) en dev et qualif.
      - key: JOURNAL_CONSULTABLE
        value: {dev: "true", qualif: "true", preprod: "false", prod: "false"}
      # CU-143 : bouchon « Simuler un virement entrant » (/test/virements-entrants) en dev et qualif.
      - key: VIREMENTS_SIMULES
        value: {dev: "true", qualif: "true", preprod: "false", prod: "false"}
      # CU-295 : « Simuler l'expiration du délai » de l'administration fiscale (/test/livret-a/...) en dev et qualif.
      - key: LIVRET_A_SIMULE
        value: {dev: "true", qualif: "true", preprod: "false", prod: "false"}
      # CU-380 (TECH-12) : date métier modifiable (/test/date-metier) en dev et qualif ; heure réelle de Paris, non modifiable, en preprod et prod.
      - key: DATE_METIER_MODIFIABLE
        value: {dev: "true", qualif: "true", preprod: "false", prod: "false"}
      # CU-381 (TECH-13) : page de test du catalogue (/test/catalogue : dépôt du fichier, lancement du batch) en dev et qualif seulement.
      - key: CATALOGUE_SIMULE
        value: {dev: "true", qualif: "true", preprod: "false", prod: "false"}
      # CU-382 (TECH-14) : Kafka de la plateforme (ADR-001, section 3 bis). Noms des topics uniquement ici, jamais dans le code :
      # cu-epargne.<environnement>.<topic> partout, dev compris (décision PO du 25/11/2026) ; groupes cu-epargne-<environnement>-<module>.
      - key: KAFKA_BOOTSTRAP_SERVERS
        value: kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092
      - key: KAFKA_TOPIC_ORDRES
        value: {dev: cu-epargne.dev.ordres, qualif: cu-epargne.qualif.ordres, preprod: cu-epargne.preprod.ordres, prod: cu-epargne.prod.ordres}
      - key: KAFKA_TOPIC_ORDRES_EXECUTES
        value: {dev: cu-epargne.dev.ordres-executes, qualif: cu-epargne.qualif.ordres-executes, preprod: cu-epargne.preprod.ordres-executes, prod: cu-epargne.prod.ordres-executes}
      - key: KAFKA_TOPIC_MOUVEMENTS
        value: {dev: cu-epargne.dev.mouvements, qualif: cu-epargne.qualif.mouvements, preprod: cu-epargne.preprod.mouvements, prod: cu-epargne.prod.mouvements}
      - key: KAFKA_TOPIC_CATALOGUE
        value: {dev: cu-epargne.dev.catalogue, qualif: cu-epargne.qualif.catalogue, preprod: cu-epargne.preprod.catalogue, prod: cu-epargne.prod.catalogue}
      - key: KAFKA_TOPIC_PROFIL_CLIENT
        value: {dev: cu-epargne.dev.profil-client, qualif: cu-epargne.qualif.profil-client, preprod: cu-epargne.preprod.profil-client, prod: cu-epargne.prod.profil-client}
      - key: KAFKA_TOPIC_RAPPROCHEMENT
        value: {dev: cu-epargne.dev.rapprochement, qualif: cu-epargne.qualif.rapprochement, preprod: cu-epargne.preprod.rapprochement, prod: cu-epargne.prod.rapprochement}
      - key: KAFKA_TOPIC_SUFFIXE_ERREURS
        value: .dlt
      - key: KAFKA_GROUP_ID_PREFIXE
        value: {dev: cu-epargne-dev, qualif: cu-epargne-qualif, preprod: cu-epargne-preprod, prod: cu-epargne-prod}
      # CU-382 : adresse de l'équipe pour les alertes (traitements en échec). dev et qualif : boîte de test (/test/emails) ;
      # preprod et prod : à confirmer avec l'équipe (vide : alerte journalisée sans e-mail).
      - key: ALERTE_EQUIPE_EMAIL
        value: {dev: alertes-equipe@hitechbank.test, qualif: alertes-equipe@hitechbank.test, preprod: "", prod: ""}
      # CU-382 : page de test des événements Kafka (/test/evenements) en dev et qualif seulement.
      - key: EVENEMENTS_SIMULES
        value: {dev: "true", qualif: "true", preprod: "false", prod: "false"}
      # CU-376 (TECH-08) : page de test des ordres (/test/ordres) et positions de test en dev et qualif seulement.
      - key: ORDRES_SIMULES
        value: {dev: "true", qualif: "true", preprod: "false", prod: "false"}
      # Comptes de test (db/demo) en dev et qualif, jamais en preprod ni en prod.
      - key: SPRING_FLYWAY_LOCATIONS
        value:
          dev: "classpath:db/migration,classpath:db/demo"
          qualif: "classpath:db/migration,classpath:db/demo"
          preprod: "classpath:db/migration"
          prod: "classpath:db/migration"
      # Swagger (.../gateway/backend/swagger-ui.html) en dev et qualif, jamais en preprod ni en prod.
      - key: SWAGGER_ACTIF
        value: {dev: "true", qualif: "true", preprod: "false", prod: "false"}
      # Lot 3 (PO, 27/11/2026) : un interrupteur par fonctionnalité et par environnement (GET /fonctionnalites).
      # Livrer une fonctionnalité = passer son interrupteur à "true" ; « false » : bouton « Bientôt ».
      # Messages (story à créer par le PO).
      - key: FONCTIONNALITE_MESSAGERIE
        value: "false"
      # Ajouter un compte d’une autre banque (story à créer).
      - key: FONCTIONNALITE_AJOUT_COMPTE_EXTERNE
        value: "false"
      # Programmer un virement sur le compte courant (story à créer).
      - key: FONCTIONNALITE_VIREMENT_PROGRAMME
        value: "false"
      # Clôturer mon compte (CU-21).
      - key: FONCTIONNALITE_CLOTURE_COMPTE
        value: "false"
      # Souscrire un LDDS (story à créer).
      - key: FONCTIONNALITE_LDDS
        value: "false"
      # Souscrire un CEL (story à créer).
      - key: FONCTIONNALITE_CEL
        value: "false"
      # Simulateur de crédit (CU-355, autre projet de la banque).
      - key: FONCTIONNALITE_SIMULATEUR_CREDIT
        value: "false"
      # Demande de crédit à la consommation (CU-366, autre projet).
      - key: FONCTIONNALITE_DEMANDE_CREDIT_CONSO
        value: "false"
      # Demande de crédit immobilier (autre projet).
      - key: FONCTIONNALITE_DEMANDE_CREDIT_IMMO
        value: "false"
      # Demande de rachat de crédits (autre projet).
      - key: FONCTIONNALITE_DEMANDE_RACHAT_CREDITS
        value: "false"
      # Simulateur PER (autre projet).
      - key: FONCTIONNALITE_SIMULATEUR_PER
        value: "false"
      # Simulateur assurance vie (autre projet).
      - key: FONCTIONNALITE_SIMULATEUR_AV
        value: "false"
      # Consulter la convention de compte (story à créer).
      - key: FONCTIONNALITE_DOCUMENT_CONVENTION
        value: "false"
      # Consulter le relevé de compte courant (story à créer).
      - key: FONCTIONNALITE_DOCUMENT_RELEVE
        value: "false"
      # Consulter l’attestation de non-détention de Livret A (story à créer).
      - key: FONCTIONNALITE_DOCUMENT_ATTESTATION_LIVRET_A
        value: "false"
      # Contacter mon conseiller (story à créer).
      - key: FONCTIONNALITE_CONTACT_CONSEILLER
        value: "false"
      # Changer mon mot de passe (D2, story à créer par le PO).
      - key: FONCTIONNALITE_CHANGEMENT_MOT_DE_PASSE
        value: "false"
      # Verser sur un PER ou une assurance vie (PER-08, AV-03).
      - key: FONCTIONNALITE_VERSEMENT_LIBRE
        value: "false"
      # Mes opérations d’un contrat (PER-14).
      - key: FONCTIONNALITE_OPERATIONS_CONTRAT
        value: "false"
      # Suivre mon contrat : valeur, gains et frais (PER-09, AV-09).
      - key: FONCTIONNALITE_SUIVI_CONTRAT
        value: "false"
      # Programmer des versements sur un PER ou une assurance vie (PER-13, AV-04).
      - key: FONCTIONNALITE_VERSEMENTS_PROGRAMMES
        value: "false"
      # Lot 6 (D7) : document d'informations par support, sur la fiche d'un support.
      - key: FONCTIONNALITE_DOCUMENT_SUPPORT
        value: "false"
      # D4 : entrée « Outils de test » et pages /test/... en dev et qualif seulement.
      - key: FONCTIONNALITE_OUTILS_TEST
        value: {dev: "true", qualif: "true", preprod: "false", prod: "false"}
  - name: gateway
    type: gateway
    # Pas d'image/tag : fourni par la plateforme (petit Traefik autonome),
    # rien à construire ni à promouvoir. Expose les backends ci-dessus
    # (type: backend) sous https://gateway.formation-ba-compte-unique.<env>.check-consulting.net/<backend>/...
    # (préfixe retiré) ; CORS limité aux frontends de l'environnement.
    # Configuration personnalisée (routage, rate limiting, authentification
    # centralisée...) : voir gateway.yaml à la racine du dépôt. Si ce fichier
    # est absent, le routage vers les backends ci-dessus est généré
    # automatiquement (comportement par défaut).
    replicas: {dev: 1, qualif: 1, preprod: 2, prod: 2}
    ingress:
      enabled: true
  - name: frontend
    type: frontend
    image: 205493924920.dkr.ecr.eu-west-3.amazonaws.com/formation-ba-compte-unique/frontend
    # Écrit par Kargo (dev automatique ; qualif/preprod/prod : promotion par clic).
    # Garder une valeur par ligne, sans commentaire en fin de ligne : Kargo
    # remplace tout jusqu'à la fin de la ligne.
    tag:
      dev: af293ee
      qualif: c8d0f73
      preprod: ""
      prod: ""
    containerPort: 8080
    replicas: {dev: 1, qualif: 1, preprod: 2, prod: 2}
    service:
      port: 80
    ingress:
      enabled: true
      path: /
      stripPrefix: false
  - name: bouchons-identite
    type: backend
    image: 205493924920.dkr.ecr.eu-west-3.amazonaws.com/formation-ba-compte-unique/bouchons-identite
    # Écrit par Kargo (dev automatique ; qualif/preprod/prod : promotion par clic).
    # Garder une valeur par ligne, sans commentaire en fin de ligne : Kargo
    # remplace tout jusqu'à la fin de la ligne.
    tag:
      dev: 564f79a
      qualif: 564f79a
      preprod: ""
      prod: ""
    containerPort: 8080
    replicas: {dev: 1, qualif: 1, preprod: 2, prod: 2}
    service:
      port: 80
    # Bouchons des partenaires d'identification (Stripe Identity, sanctions/PEP).
    # Pas d'Ingress direct : exposé par le pod "gateway" :
    #   https://gateway.formation-ba-compte-unique.<env>.check-consulting.net/bouchons-identite/...  (préfixe retiré)
    # Base PostgreSQL bouchons_identite : créée et sauvegardée automatiquement.
    database:
      name: bouchons_identite
    envList:
      - key: LOG_LEVEL
        value: {dev: debug, qualif: info, preprod: info, prod: warn}
      # Swagger (.../gateway/bouchons-identite/swagger-ui.html) en dev et qualif, jamais en preprod ni en prod.
      - key: SWAGGER_ACTIF
        value: {dev: "true", qualif: "true", preprod: "false", prod: "false"}
      # CU-295 : bouchon de l'administration fiscale (/administration-fiscale/...) en dev et qualif seulement.
      - key: BOUCHON_FISCAL_ACTIF
        value: {dev: "true", qualif: "true", preprod: "false", prod: "false"}
