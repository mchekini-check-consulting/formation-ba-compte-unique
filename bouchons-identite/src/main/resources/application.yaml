spring:
  application:
    name: bouchons-identite
  # Base PostgreSQL. Valeurs locales (compose.yaml) ; sur le cluster, remplacées par
  # SPRING_DATASOURCE_URL, _USERNAME, _PASSWORD (helm.yaml : database).
  datasource:
    url: jdbc:postgresql://localhost:5433/bouchons_identite
    username: app
    password: app
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # le schéma vient uniquement des migrations Flyway

logging:
  level:
    root: ${LOG_LEVEL:INFO}

# Swagger : description des API (/v3/api-docs) et page pour les essayer (/swagger-ui.html).
# Actif en local, dev et qualif ; SWAGGER_ACTIF=false en preprod et prod (helm.yaml) : les
# adresses de Swagger n'existent alors pas.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ACTIF:true}
  swagger-ui:
    enabled: ${SWAGGER_ACTIF:true}
